<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Snapshotter release banner</title>
<style>
    :root {
        --label: #f5f5f7;
        --secondary: #a1a1a6;
        --accent: #0a84ff;
        --bg: #101013;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
        background: var(--bg);
        color: var(--label);
        -webkit-font-smoothing: antialiased;
    }
    .frame {
        width: 1600px;
        height: 900px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        padding: 0 120px;
        background:
            radial-gradient(1100px 700px at 82% -6%, rgb(10 132 255 / 0.22), transparent 60%),
            radial-gradient(700px 500px at 6% 108%, rgb(10 132 255 / 0.10), transparent 55%),
            linear-gradient(180deg, #16161a 0%, var(--bg) 100%);
    }
    /* Low opacity dot grid, pushed to the background. */
    .frame::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgb(255 255 255 / 0.055) 1px, transparent 1px);
        background-size: 44px 44px;
        -webkit-mask-image: linear-gradient(180deg, rgb(0 0 0 / 0.9), transparent 92%);
        mask-image: linear-gradient(180deg, rgb(0 0 0 / 0.9), transparent 92%);
    }
    .content {
        position: relative;
        max-width: 1120px;
    }
    .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 56px;
    }
    .brand svg { width: 40px; height: 40px; flex: none; }
    .brand .wordmark {
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.01em;
        color: var(--label);
    }
    .headline {
        margin: 0 0 22px;
        font-size: 96px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.02em;
        max-width: 1000px;
    }
    .support {
        margin: 0 0 52px;
        font-size: 34px;
        font-weight: 450;
        line-height: 1.4;
        color: var(--secondary);
        max-width: 820px;
    }
    .kicker {
        display: inline-block;
        margin-bottom: 26px;
        font-size: 24px;
        font-weight: 550;
        color: var(--accent);
        letter-spacing: 0.02em;
    }
</style>
</head>
<body>
    <div class="frame">
        <div class="content">
            <div class="brand">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 2.5 19 5v6c0 4.5-3 8-7 9.7C8 19 5 15.5 5 11V5l7-2.5Z"
                          fill="#0a84ff" fill-opacity="0.16" stroke="#0a84ff" stroke-width="1.7"
                          stroke-linejoin="round"/>
                    <path d="M8.7 11.6 11 13.9l4.4-4.7"
                          stroke="#0a84ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="wordmark">Snapshotter</span>
            </div>
            <div class="kicker">New release</div>
            <h1 class="headline">Snapshotter __VERSION__</h1>
            <p class="support">Back up your important folders to your own storage, straight from the menu bar.</p>
        </div>
    </div>
</body>
</html>
