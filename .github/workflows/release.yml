name: release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: >-
                    Release tag to version this build as (for example v1.2.3 or
                    v1.2.3-rc.1). Leave empty to build a CI pre-release named
                    dev-<run number> from the selected ref.
                required: false
            channel:
                description: Release channel when a tag input is given.
                type: choice
                required: false
                default: prerelease
                options:
                    - prerelease
                    - release

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: macos-15
        outputs:
            version: ${{ steps.meta.outputs.version }}
            tag: ${{ steps.meta.outputs.tag }}
            prerelease: ${{ steps.meta.outputs.prerelease }}
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.21.0

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: engine/go.mod
                  cache-dependency-path: engine/go.sum

            - name: Validate signing secrets
              env:
                  MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
                  MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
                  MACOS_CERTIFICATE_ID: ${{ secrets.MACOS_CERTIFICATE_ID }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
              run: |
                  set -eu
                  declare -a required=(MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD MACOS_CERTIFICATE_ID APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD)
                  declare -a missing=()
                  for name in "${required[@]}"; do
                      if [ -z "${!name:-}" ]; then missing+=("$name"); fi
                  done
                  if [ "${#missing[@]}" -gt 0 ]; then
                      echo "::error::Missing required release secrets: ${missing[*]}"
                      echo "Add them to the repository secrets so releases can be signed and notarized."
                      exit 1
                  fi

            - name: Compute release metadata
              id: meta
              env:
                  INPUT_TAG: ${{ inputs.tag }}
                  INPUT_CHANNEL: ${{ inputs.channel }}
              run: |
                  set -eu
                  tag=""
                  version=""
                  prerelease="false"

                  if [ "$GITHUB_EVENT_NAME" = "push" ]; then
                      # Tag push, e.g. v1.2.3 (release) or v1.2.3-rc.1 (pre-release).
                      tag="$GITHUB_REF_NAME"
                      version="${tag#v}"
                      case "$version" in *-*) prerelease="true" ;; esac
                  else
                      # Manual/workflow_dispatch build.
                      channel="${INPUT_CHANNEL:-prerelease}"
                      if [ -n "$INPUT_TAG" ]; then
                          tag="$INPUT_TAG"
                          version="${tag#v}"
                          [ "$channel" = "prerelease" ] && prerelease="true"
                          case "$version" in *-*) prerelease="true" ;; esac
                      else
                          base="$(node -p "require('./package.json').version")"
                          version="${base}-ci.${GITHUB_RUN_NUMBER}"
                          tag="dev-${GITHUB_RUN_NUMBER}"
                          prerelease="true"
                      fi
                  fi

                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

            - name: Verify (lint, test, build, race, strict Swift)
              run: |
                  set -eu
                  pnpm lint
                  pnpm test
                  pnpm build
                  (cd engine && go test -race ./...)
                  swift build --package-path macos -Xswiftc -warnings-as-errors

            - name: Set up Developer ID keychain and notary profile
              env:
                  MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
                  MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
              run: |
                  set -eu
                  keychain_path="$RUNNER_TEMP/snapshotter-signing.keychain-db"
                  keychain_pwd="$(openssl rand -hex 12)"

                  echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
                  echo "KEYCHAIN_PWD=$keychain_pwd" >> "$GITHUB_ENV"

                  security create-keychain -p "$keychain_pwd" "$keychain_path"
                  security set-keychain-settings -lut 21600 "$keychain_path"
                  security unlock-keychain -p "$keychain_pwd" "$keychain_path"

                  echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
                  security import "$RUNNER_TEMP/cert.p12" \
                      -P "$MACOS_CERTIFICATE_PWD" \
                      -t cert -f pkcs12 -k "$keychain_path" -A
                  # Allow codesign to use the certificates without a GUI prompt.
                  security set-key-partition-list \
                      -S apple-tool:,apple:,codesign: -s -k "$keychain_pwd" "$keychain_path"

                  security list-keychains -d user -s "$keychain_path"
                  security default-keychain -s "$keychain_path"

                  xcrun notarytool store-credentials snapshotter-notary \
                      --apple-id "$APPLE_ID" \
                      --team-id "$APPLE_TEAM_ID" \
                      --password "$APPLE_APP_PASSWORD" \
                      --keychain "$keychain_path"

            - name: Build and package signable artifacts (.app and .dmg)
              env:
                  CODESIGN_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_ID }}
                  NOTARY_PROFILE: snapshotter-notary
              run: |
                  set -eu
                  sh scripts/package-release.sh

            - name: Prepare release assets
              run: |
                  set -eu
                  version="${{ steps.meta.outputs.version }}"
                  ditto -c -k --sequesterRsrc --keepParent \
                      build/Snapshotter.app "build/Snapshotter-${version}-macOS.zip"
                  mv build/Snapshotter.dmg "build/Snapshotter-${version}-macOS.dmg"
                  ls -lh build/*-macOS.*

            - name: Generate release banner
              env:
                  BANNER_VERSION: ${{ steps.meta.outputs.version }}
                  BANNER_OUT: build/Snapshotter-banner.png
                  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
                  OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL }}
                  OPENCODE_MODEL_ID: ${{ secrets.OPENCODE_MODEL_ID }}
              run: |
                  set -eu
                  sh scripts/generate-release-banner.sh

            - name: Upload release assets
              uses: actions/upload-artifact@v7
              with:
                  name: snapshotter-release
                  path: |
                      build/Snapshotter-*-macOS.zip
                      build/Snapshotter-*-macOS.dmg
                      build/Snapshotter-banner.png
                  if-no-files-found: error

    release:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download release assets
              uses: actions/download-artifact@v8
              with:
                  name: snapshotter-release
                  path: release-assets

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.build.outputs.tag }}
                  name: Snapshotter ${{ needs.build.outputs.version }}
                  body: |
                      ![Snapshotter ${{ needs.build.outputs.version }}](https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.tag }}/Snapshotter-banner.png)

                      ## Snapshotter ${{ needs.build.outputs.version }}

                      Download the macOS application bundle (zip) or the installer
                      disk image (dmg), both signed and notarized.
                  prerelease: ${{ needs.build.outputs.prerelease }}
                  generate_release_notes: true
                  fail_on_unmatched_files: true
                  files: |
                      release-assets/Snapshotter-banner.png
                      release-assets/*-macOS.zip
                      release-assets/*-macOS.dmg