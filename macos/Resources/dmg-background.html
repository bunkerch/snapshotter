<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapshotter DMG background (700x420, light)</title>
    <style>
        @font-face { font-family: "SF Pro Display"; src: local("SF Pro Display"); font-weight: 400 800; }
        * { box-sizing: border-box; }
        html, body { margin: 0; width: 700px; height: 420px; overflow: hidden; padding: 0; }
        body { font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif; }
        .stage {
            position: relative; width: 700px; height: 420px; overflow: hidden;
            background:
                radial-gradient(circle at 86% 8%, rgb(34 90 142 / 14%), transparent 38%),
                linear-gradient(130deg, #f6f8fb 0%, #eef2f6 55%, #e4eaf0 100%);
        }
        .stage::after {
            position: absolute; inset: 0; content: ""; opacity: .05; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
        }

        /* Brand wordmark, top-left */
        .brand { position: absolute; top: 30px; left: 34px; display: flex; align-items: center; gap: 11px; color: #12212f; }
        .brand svg { width: 27px; height: 27px; }
        .brand span { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }

        /* Icon landing slots (icon-size 128, centered vertically) */
        .slot { position: absolute; width: 140px; height: 140px; border: 2px solid rgb(18 33 47 / 16%); border-radius: 34px; }
        .slot.app { left: 120px; top: 128px; }
        .slot.apps { left: 440px; top: 128px; }

        /* Arrow guide between the slots */
        .track { position: absolute; top: 174px; left: 292px; width: 118px; height: 48px; }
        .track line { stroke: rgb(18 33 47 / 45%); stroke-width: 4; stroke-linecap: round; }
        .track .head path { stroke: rgb(18 33 47 / 45%); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }

        /* Instruction line centred below the arrow */
        .hint { position: absolute; top: 300px; left: 0; right: 0; text-align: center; color: #2a3b4a; font-size: 19px; font-weight: 640; letter-spacing: -.012em; }
        .hint .arrow { color: #2f9e4f; }
        .hint .target { color: #4c6377; }
    </style>
</head>
<body>
    <main class="stage">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3v8Z"/><path d="m9 12 2 2 4-4"/></svg>
            <span>Snapshotter</span>
        </div>

        <div class="slot app" aria-hidden="true"></div>
        <div class="slot apps" aria-hidden="true"></div>

        <svg class="track" viewBox="0 0 118 48" aria-hidden="true">
            <line x1="0" y1="24" x2="86" y2="24"></line>
            <g class="head"><path d="M82 8 L114 24 L82 40"></path></g>
        </svg>

        <div class="hint">
            Drag <span class="arrow">&#10132;</span> Snapshotter into <span class="target">Applications</span>
        </div>
    </main>
</body>
</html>
